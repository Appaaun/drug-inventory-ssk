# envs/inventory-service/dev.yaml
replicaCount: 1

image:
  repository: harbor.province.local/drug-inventory/inventory-service
  tag: "main"
  pullPolicy: Always

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 256Mi }

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "dev"
  - name: DB_HOST
    value: "postgres-dev.data.svc.cluster.local"
  - name: DB_NAME
    value: "drug_inventory_dev"

envFrom:
  - secretRef:
      name: inventory-service-db-credentials

externalSecret:
  enabled: true
  secretStoreRef: vault-backend
  target: inventory-service-db-credentials
  data:
    - secretKey: DB_USER
      remoteRef: { key: secret/data/dev/inventory-service, property: db_user }
    - secretKey: DB_PASSWORD
      remoteRef: { key: secret/data/dev/inventory-service, property: db_password }

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: inventory-dev.province.go.th
      paths:
        - path: /api/v1/inventory
          pathType: Prefix
  tls:
    - secretName: inventory-dev-tls
      hosts: [inventory-dev.province.go.th]

rollout:
  enabled: false

networkPolicy:
  enabled: false

serviceAccount:
  create: true
  name: inventory-service
