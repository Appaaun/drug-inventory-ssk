# envs/inventory-service/dr.yaml — DR site (GDCC), warm standby
replicaCount: 1

image:
  repository: harbor.province.local/drug-inventory/inventory-service
  tag: "1.4.0"

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 256Mi }

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: false

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "dr"
  - name: DB_HOST
    value: "postgres-replica.data.svc.cluster.local"
  - name: DB_NAME
    value: "drug_inventory"

envFrom:
  - secretRef:
      name: inventory-service-db-credentials

externalSecret:
  enabled: true
  secretStoreRef: vault-backend
  target: inventory-service-db-credentials
  data:
    - secretKey: DB_USER
      remoteRef: { key: secret/data/prod/inventory-service, property: db_user }
    - secretKey: DB_PASSWORD
      remoteRef: { key: secret/data/prod/inventory-service, property: db_password }

ingress:
  enabled: false

rollout:
  enabled: false

networkPolicy:
  enabled: true

serviceAccount:
  create: true
  name: inventory-service
