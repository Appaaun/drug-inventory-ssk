# envs/prod/values.yaml
replicaCount: 3

image:
  repository: harbor.province.local/drug-inventory/requisition-service
  tag: "1.4.0"          # ผูกกับ release tag เดียวกับ ArgoCD targetRevision
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 2

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "prod"
  - name: DB_HOST
    value: "postgres-primary.data.svc.cluster.local"
  - name: DB_NAME
    value: "drug_inventory"

envFrom:
  - secretRef:
      name: requisition-service-db-credentials   # สร้างโดย ExternalSecret ด้านล่าง

externalSecret:
  enabled: true
  secretStoreRef: vault-backend
  target: requisition-service-db-credentials
  data:
    - secretKey: DB_USER
      remoteRef:
        key: secret/data/prod/requisition-service
        property: db_user
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/data/prod/requisition-service
        property: db_password

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: inventory.province.go.th
      paths:
        - path: /api/v1/requisitions
          pathType: Prefix
  tls:
    - secretName: inventory-tls
      hosts:
        - inventory.province.go.th

rollout:
  enabled: true          # ใช้ Argo Rollouts CRD แทน Deployment ธรรมดา (ดู templates/rollout.yaml)

networkPolicy:
  enabled: true

serviceAccount:
  create: true
  name: requisition-service
  annotations: {}
