apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inventory-service-dev
  namespace: argocd
spec:
  project: drug-inventory
  source:
    repoURL: https://gitlab.internal/health-region/gitops-repo.git
    targetRevision: main
    path: apps/inventory-service
    helm:
      valueFiles:
        - ../../envs/inventory-service/dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
