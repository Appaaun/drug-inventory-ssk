apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespace-baseline-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"   # sync ก่อน service app อื่นเสมอ (default-deny-all ต้องมาก่อน allow-rule ของแต่ละ service)
spec:
  project: drug-inventory
  source:
    repoURL: https://gitlab.internal/health-region/gitops-repo.git
    targetRevision: main
    path: platform/namespace-baseline
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
