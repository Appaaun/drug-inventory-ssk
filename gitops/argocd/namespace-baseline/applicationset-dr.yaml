apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: namespace-baseline-dr
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - cluster: dr-gdcc
            server: https://k8s-dr.gdcc.go.th
  template:
    metadata:
      name: namespace-baseline-dr
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
    spec:
      project: drug-inventory
      source:
        repoURL: https://gitlab.internal/health-region/gitops-repo.git
        targetRevision: release-1.4.0
        path: platform/namespace-baseline
      destination:
        server: '{{server}}'
        namespace: prod
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
