# Default values สำหรับ chart นี้ — envs/{dev,prod,dr}/values.yaml จะ override ทับด้วย -f
replicaCount: 1

image:
  repository: harbor.province.local/drug-inventory/inventory-service
  tag: "latest"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

env: []
envFrom: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: null

podDisruptionBudget:
  enabled: false
  minAvailable: 1

topologySpreadConstraints: []

ingress:
  enabled: false
  className: nginx
  hosts: []
  tls: []

# false = plain Deployment (dev/dr) · true = Argo Rollouts canary (prod)
rollout:
  enabled: false

networkPolicy:
  enabled: false
  allowIntraNamespaceIngress: false
  ingressHISWan: false   # true เฉพาะ integration-service (รับ HL7 MLLP จาก รพ.สต.)
  egressHISWan: false    # true เฉพาะ integration-service (ส่งกลับไป HIS)

externalSecret:
  enabled: false
  secretStoreRef: vault-backend
  target: inventory-service-db-credentials
  data: []

serviceAccount:
  create: true
  name: inventory-service
  annotations: {}
