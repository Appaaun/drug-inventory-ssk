apiVersion: v1
kind: Service
metadata:
  name: {{ include "servicechart.fullname" . }}-stable
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "servicechart.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ include "servicechart.fullname" . }}
  ports:
    - port: 80
      targetPort: 8080
---
{{- if .Values.rollout.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "servicechart.fullname" . }}-canary
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "servicechart.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ include "servicechart.fullname" . }}
  ports:
    - port: 80
      targetPort: 8080
{{- end }}
