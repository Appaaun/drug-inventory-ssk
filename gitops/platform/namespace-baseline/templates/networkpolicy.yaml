# deny-all เป็น baseline ของทุก pod ใน namespace นี้ — service chart แต่ละตัวค่อยเปิดรูรั่วเฉพาะที่ตัวเองต้องใช้
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# DNS resolution (deny-all บล็อก kube-dns ด้วย ทุก pod ต้องการเส้นทางนี้)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
---
# ฝั่ง namespace data: Postgres รับ connection จาก namespace นี้ทั้งหมด (service ใดใน namespace นี้ก็ต่อได้)
# ต้องมีแค่ชุดเดียวต่อ namespace ต้นทาง — ถ้าไปประกาศซ้ำใน service chart แต่ละตัวจะชนกัน (ชื่อ resource ซ้ำ namespace เดียวกัน)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-{{ .Release.Namespace }}-to-postgres
  namespace: {{ .Values.dataNamespace }}
spec:
  podSelector:
    matchLabels: { app: postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Release.Namespace }} }
      ports: [{ protocol: TCP, port: 5432 }]
